name: Release Verification CI (CPU Gates)

on:
  push:
    branches: [main, audit/*, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-api:
    name: Frontend & Control Plane Unit/Integration Gates (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Vitest test suites
        run: npm run test

      - name: Production Vite build
        run: npm run build

  python-3d-worker-cpu:
    name: Python 3D Worker Unit & Integration Tests (CPU Fixtures)
    runs-on: ubuntu-latest
    env:
      HETTETY_ACCEPTANCE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/acceptance_evidence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r hettety-3d-worker/requirements.txt pytest pytest-cov

      - name: Run Worker Unit & Integration Pytest suites
        run: python -m pytest hettety-3d-worker/tests

      - name: Verify Strict Real Pipeline Guards & Acceptance Suite
        run: python -m pytest hettety-3d-worker/tests/acceptance/test_real_gpu_reconstruction.py -v

      - name: Verify Redis Worker Lifecycle Integration
        run: python -m pytest hettety-3d-worker/tests/acceptance/test_real_redis_worker_lifecycle.py -v

      - name: Archive CI Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-acceptance-evidence
          path: ${{ github.workspace }}/artifacts/acceptance_evidence/*
          if-no-files-found: warn
