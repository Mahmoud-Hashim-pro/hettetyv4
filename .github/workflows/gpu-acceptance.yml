name: Dedicated Physical GPU Acceptance Gate

on:
  workflow_dispatch:
    inputs:
      run_real_gpu_acceptance:
        description: 'Explicit confirmation to execute 30,000-iteration Graphdeco 3DGS on dedicated physical NVIDIA GPU'
        required: true
        default: true
        type: boolean
      target_property_fixture:
        description: 'Acceptance fixture dataset to execute against (allowlisted: prop_villa_marassi_01, prop_courtyard_dslr_02)'
        required: true
        default: 'prop_villa_marassi_01'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authoritative-gpu-acceptance:
    name: Physical GPU Photogrammetric Acceptance Gate (NVIDIA CUDA 11.8+ Required)
    # Enforces explicit control: job executes ONLY when run_real_gpu_acceptance is true
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_real_gpu_acceptance == true || inputs.run_real_gpu_acceptance == 'true') }}
    runs-on: [self-hosted, gpu, nvidia]
    env:
      HETTETY_REAL_PIPELINE_STRICT: '1'
      HETTETY_ACCEPTANCE_DATASET: ${{ inputs.target_property_fixture }}
      HETTETY_ACCEPTANCE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/acceptance_evidence
      GAUSSIAN_SPLATTING_PATH: '/opt/gaussian-splatting/train.py'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Physical NVIDIA GPU Hardware & Drivers
        run: |
          echo "=== NVIDIA Hardware Inspection ==="
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'CRITICAL_BLOCKER: CUDA is not available on this runner!'"
          python -c "import torch; v = tuple(map(int, torch.version.cuda.split('.')[:2])); assert v >= (11, 8), f'CRITICAL_BLOCKER: CUDA version {torch.version.cuda} is below 11.8!'"
          python -c "import torch; vram = torch.cuda.get_device_properties(0).total_memory / (1024**3); assert vram >= 11.5, f'CRITICAL_BLOCKER: Minimum 12 GB VRAM required (detected {vram:.2f} GB on {torch.cuda.get_device_name(0)})!'"

      - name: Verify Native COLMAP Installation
        run: |
          echo "=== COLMAP Binary Inspection ==="
          colmap --version

      - name: Verify Official Graphdeco 3DGS Submodules
        run: |
          echo "=== Graphdeco CUDA Submodules Inspection ==="
          python -c "import diff_gaussian_rasterization; import simple_knn; print('Graphdeco CUDA submodules verified successfully.')"

      - name: Execute Authoritative Real GPU Reconstruction Acceptance Suite
        run: |
          echo "=== Running Acceptance Test Suite with Dataset: $HETTETY_ACCEPTANCE_DATASET ==="
          python -m pytest hettety-3d-worker/tests/acceptance/test_real_gpu_reconstruction.py -v -s

      - name: Verify Acceptance Evidence Integrity
        if: always()
        run: |
          python -c "
          import os, json, sys
          evidence_dir = os.environ.get('HETTETY_ACCEPTANCE_EVIDENCE_DIR', 'artifacts/acceptance_evidence')
          evidence_file = os.path.join(evidence_dir, 'acceptance_evidence.json')
          if not os.path.exists(evidence_file):
              print(f'CRITICAL_FAILURE: Required evidence file missing at {evidence_file}')
              sys.exit(1)
          with open(evidence_file) as f:
              ev = json.load(f)
          print(f'Verified evidence: run_id={ev.get(\"run_id\")} status={ev.get(\"status\")}')
          if ev.get('status') not in ('PASSED', 'BLOCKED', 'SKIPPED'):
              print(f'CRITICAL_FAILURE: Evidence status {ev.get(\"status\")} is invalid!')
              sys.exit(1)
          "

      - name: Archive Machine-Readable Acceptance Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-gpu-acceptance-evidence
          path: ${{ github.workspace }}/artifacts/acceptance_evidence/*
          if-no-files-found: error
